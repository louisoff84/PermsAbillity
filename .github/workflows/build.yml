name: Gradle Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build shaded plugin
        run: gradle clean shadowJar --stacktrace
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PermsAbillity
          path: build/libs/PermsAbillity-*.jar
          if-no-files-found: error
